[project]
name = "xlnt-ableton-mcp"
version = "0.1.0"
description = "XLNT Studio's hybrid TCP/UDP Ableton Live MCP server (based on uisato/ableton-mcp-extended, MIT)"
readme = "../README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
xy_controller = ["pynput>=1.7.6", "screeninfo>=0.8.1"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "tools", "udp"]

[tool.pytest.ini_options]
markers = [
    "integration: requires running Ableton Live instance",
]
addopts = "-m 'not integration'"
